name: Build Reel RPG GBA ROM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify toolchain and libgba
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/gba_rules"
          test -f "$DEVKITPRO/libgba/include/gba.h"
          command -v zip
      - name: Build ROM
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make
          test -s reel-rpg.gba
          mkdir -p dist
          cp reel-rpg.gba dist/
          cp README.md dist/README.txt
          cd dist
          zip -9 ReelRPG-GBA.zip reel-rpg.gba README.txt
      - name: Upload ROM and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ReelRPG-GBA
          path: |
            reel-rpg.gba
            dist/ReelRPG-GBA.zip
          if-no-files-found: error
          retention-days: 30
